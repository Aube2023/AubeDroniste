{% extends "base.html" %}
{% block title %}{{ post.author_name }} · {{ t('feed.h1') }} | AubePilot{% endblock %}
{% block content %}
<div class="feed-wrap">
  <p><a href="{{ url_for('feed_index') }}" class="ghost">← {{ t('feed.back') }}</a></p>
  {% set full = true %}{% include "_feed_post.html" %}
</div>
<span hidden id="feed-i18n" data-copied="{{ t('feed.copied') }}"></span>
<script src="{{ url_for('static', filename='js/feed.js') }}" defer></script>
{% endblock %}
